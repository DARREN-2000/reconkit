[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reconkit"
version = "2.2.0"
description = "Security Reconnaissance & Assessment Platform"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "ReconKit Authors"}
]
dependencies = []

[project.scripts]
reconkit = "reconkit.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0"
]

[tool.setuptools.packages.find]
include = ["reconkit*"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py", "unit_tests.py"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
